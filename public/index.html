<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AQMPM Live Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  🌍 AQMPM – Live Air Quality Dashboard
</header>

<section class="aqi-box">
  <h2>Overall AQI</h2>
  <div id="aqiValue">--</div>
  <div id="aqiText">Waiting for sensor data...</div>
</section>

<section class="grid" id="cards"></section>

<section class="chart-section">
  <canvas id="aqiChart"></canvas>
</section>

<footer id="status">
  Connecting to server...
</footer>

<script src="script.js"></script>
</body>
</html>
