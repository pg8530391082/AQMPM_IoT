<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AQMPM | Air Quality Monitoring</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<header>

<div class="header-left">

<img src="logo.png" class="logo">

<h1>Air Quality & Pollution Monitoring System</h1>

</div>

<div class="location">

📍 Sangli

</div>

</header>



<section class="overall-aqi">

<div class="aqi-card-large" id="aqiCard">

<h2>Overall AQI</h2>

<div id="aqiValue" class="aqi-number">0</div>

<div id="aqiStatus" class="aqi-status">Good</div>

</div>

</section>



<section class="sensor-section">

<div class="sensor-grid">

<div class="sensor-card">
<h3>PM2.5</h3>
<p id="pm25">0</p>
<span>µg/m³</span>
</div>

<div class="sensor-card">
<h3>PM10</h3>
<p id="pm10">0</p>
<span>µg/m³</span>
</div>

<div class="sensor-card">
<h3>CO</h3>
<p id="co">0</p>
<span>ppm</span>
</div>

<div class="sensor-card">
<h3>VOC</h3>
<p id="voc">0</p>
<span>ppm</span>
</div>

<div class="sensor-card">
<h3>SO₂</h3>
<p id="so2">0</p>
<span>ppm</span>
</div>

<div class="sensor-card">
<h3>NO₂</h3>
<p id="no2">0</p>
<span>ppm</span>
</div>

<div class="sensor-card">
<h3>NH₃</h3>
<p id="nh3">0</p>
<span>ppm</span>
</div>

<div class="sensor-card">
<h3>Temperature</h3>
<p id="temp">0</p>
<span>°C</span>
</div>

<div class="sensor-card">
<h3>Humidity</h3>
<p id="hum">0</p>
<span>%</span>
</div>

</div>

</section>



<section class="trends">

<h2>AQI Trend (AQI vs Time)</h2>

<div class="aqi-chart-container">

<canvas id="aqiChart"></canvas>

</div>

</section>



<footer>

<p>Smart Air Quality Monitoring System</p>
<p>Developed by @Piyush</p>

</footer>


<script src="script.js"></script>

</body>

</html>
